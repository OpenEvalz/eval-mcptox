[project]
name = "openevalz-eval-mcptox"
version = "0.1.0"
description = "OpenEvalz packaging of MCPTox: Tool Poisoning Attacks on Real-World MCP Servers"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.260",
  "trusted-router-py>=0.7.0",
  "pyyaml>=6",
]

[tool.openevalz]
eval = "mcptox"
execution_class = "network"
